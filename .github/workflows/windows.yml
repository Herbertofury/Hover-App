name: Windows source checks
on:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.95.0', '1.99.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify public branch commit privacy
        env:
          PUBLIC_BRANCH_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/check-public-metadata.ps1 -Revision $env:PUBLIC_BRANCH_HEAD
      - name: Install exact Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: Lint
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native Windows readers
        run: cargo +${{ matrix.rust }} test --workspace --locked
      - name: Test Hover window lifecycle on dedicated Windows runner
        run: cargo +${{ matrix.rust }} test -p hover-win --locked platform::tests::pinned_native_window_lifecycle -- --ignored --exact --nocapture
      - name: Build release
        run: cargo +${{ matrix.rust }} build --release --workspace --locked
      - name: Test real Hover through private agent control
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/agent-fixtures -Force | Out-Null
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/Llama-Logic/LlamaLogic/4a3d576f0afb776aba783db561760afb5b5de8b7/LlamaLogic.Packages.UnitTests/TestPackage.package -OutFile target/agent-fixtures/TestPackage.package
          ./scripts/test-agent.ps1 -DbpfFixture target/agent-fixtures/TestPackage.package
